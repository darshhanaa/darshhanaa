name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: darshhanaa
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#39d353&bg_color=#0d1117

      - name: Find generated SVG
        run: |
          echo "Files generated:"
          find dist -type f -print

      - name: Add Stars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("dist").glob("*.svg"))

          if not files:
              raise SystemExit("No SVG file was generated.")

          file = files[0]
          print(f"Editing: {file}")

          svg = file.read_text()

          stars = """
          <g fill="#ffffff" opacity="0.75">
            <circle cx="55" cy="35" r="1.5"/>
            <circle cx="115" cy="70" r="1"/>
            <circle cx="180" cy="25" r="1.8"/>
            <circle cx="245" cy="85" r="1.2"/>
            <circle cx="320" cy="40" r="1"/>
            <circle cx="410" cy="75" r="1.7"/>
            <circle cx="500" cy="30" r="1.1"/>
            <circle cx="590" cy="90" r="1.5"/>
            <circle cx="680" cy="45" r="1"/>
            <circle cx="770" cy="80" r="1.8"/>
            <circle cx="860" cy="30" r="1.2"/>
            <circle cx="950" cy="70" r="1"/>
            <circle cx="1040" cy="40" r="1.7"/>
            <circle cx="1130" cy="85" r="1.1"/>
          </g>

          <g fill="#8b949e" opacity="0.6">
            <circle cx="90" cy="100" r="0.8"/>
            <circle cx="150" cy="55" r="0.7"/>
            <circle cx="280" cy="20" r="0.8"/>
            <circle cx="360" cy="105" r="0.7"/>
            <circle cx="450" cy="50" r="0.8"/>
            <circle cx="540" cy="115" r="0.7"/>
            <circle cx="635" cy="20" r="0.8"/>
            <circle cx="730" cy="105" r="0.7"/>
            <circle cx="820" cy="55" r="0.8"/>
            <circle cx="910" cy="115" r="0.7"/>
            <circle cx="1000" cy="20" r="0.8"/>
            <circle cx="1090" cy="105" r="0.7"/>
          </g>
          """

          if "</svg>" not in svg:
              raise SystemExit("Generated file is not a valid SVG.")

          svg = svg.replace("</svg>", stars + "</svg>")

          file.write_text(svg)
          print("Stars added successfully.")
          PY

      - name: Rename Snake
        run: |
          SVG=$(find dist -type f -name "*.svg" | head -n 1)
          cp "$SVG" dist/github-contribution-grid-snake.svg

      - name: Deploy Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output